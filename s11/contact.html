<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Centria Edu | Basics of Web Development</title>

</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html#">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Contact Us
                    </h1>


                    <a href="#topics" class="button">
                        Start learning
                    </a>

                </div>
            </div>
        </section>

        <section class="contact" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <form method="post" class="card" action="https://httpbin.org/post">
                    <label for="name">Name (required, 2–80 characters)</label>
                    <input type="text" id="name" name="name" minlength="2" maxlength="80" required>

                    <label for="email">Email address (required)</label>
                    <input type="email" id="email" name="email" autocomplete="email" maxlength="120" required>

                    <label for="phone">Phone number (optional)</label>
                    <p id="phone-help">
                        Enter 7–15 digits, optionally starting with +.
                        Do not use spaces or hyphens. Example: +358401234567.
                    </p>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" pattern="[+]?[0-9]{7,15}"
                        aria-describedby="phone-help">

                    <label for="subject">Subject (required)</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="feedback">Feedback</option>
                        <option value="question">Question</option>
                        <option value="other">Other</option>
                    </select>

                    <fieldset id="contact-method">
                        <legend>Preferred contact method (required)</legend>

                        <input type="radio" id="contact-email" name="contact_method" value="email" required>
                        <label for="contact-email">Email</label>

                        <input type="radio" id="contact-phone" name="contact_method" value="phone" required>
                        <label for="contact-phone">Phone</label>
                    </fieldset>

                    <label for="message">Message (required)</label>
                    <textarea name="message" id="message"
                        placeholder="Write your message here. Min 20 characters, max 1000 characters." minlength="20"
                        maxlength="1000" required></textarea>

                    <input type="submit" value="Submit">
                </form>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>

</html>
