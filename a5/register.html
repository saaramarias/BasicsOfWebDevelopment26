<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Saara Saarnisto">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">

  <title>Cats Are Gods - Register</title>

</head>

<body>

  <header>
    <div class="container">
      <nav>
        <div class="logo">
          <img src="favicon.ico" alt="cat paw">
        </div>
        <div class="title">
          Cats Are Gods
        </div>
        <div class="break"></div>
        <ul class="links">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="register.html" aria-current="page">Register</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="hero"></div>

  <main class="register-section">
    <div class="container">
      <div class="register-intro">
        <h1>Join the cat community</h1>
        <p>Register to share your love of cats and become part of our cozy community. Fill in all the fields below to create your account.</p>
      </div>

      <form class="register-form" action="https://httpbin.org/post" method="post">
        <div class="form-field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" minlength="3" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" minlength="8" required>
        </div>

        <div class="form-field">
          <label for="user-type">User type</label>
          <select id="user-type" name="user_type" required>
            <option value="" selected disabled>Choose your cat community role</option>
            <option value="cat-owner">Cat owner</option>
            <option value="cat-lover">Cat lover</option>
            <option value="cat-photographer">Cat photographer</option>
          </select>
        </div>

        <div class="form-field terms-field">
          <input type="checkbox" id="terms" name="terms" value="accepted" required>
          <label for="terms">I accept the terms of use.</label>
        </div>

        <button class="button" type="submit">Register</button>
      </form>
    </div>
  </main>

</body>

</html>
