<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ville Heikkiniemi">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">

    <title>Centria Edu | Basics of Web Development</title>

</head>

<body>

    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    centria <span>edu</span>
                </div>

                <ul>
                    <li><a href="index.html#">Home</a></li>
                    <li><a href="index.html#topics">Topics</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="contact.html" aria-current="page">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="container">
                <div class="hero-content">

                    <span class="label">Basics of Web Development</span>

                    <h1>
                        Contact Us
                    </h1>


                    <a href="#topics" class="button">
                        Start learning
                    </a>

                </div>
            </div>
        </section>

        <section class="contact" id="contact">
            <div class="container">

                <h2>Contact us</h2>

                <form method="post" class="card" action="https://httpbin.org/post">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                    <br>
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                    <br>
                    <label for="tel">Phone</label>
                    <input type="tel" id="phone" name="phone" autocomplete="phone" required>
                    <br>
                    <label for="subject">Subject</label>
                    <select id="subject" name="subject" required>
                        <option value="">Choose a subject</option>
                        <option value="feedback">Feedback</option>
                        <option value="question">Question</option>
                        <option value="other">Other</option>
                    </select>
                    <br>
                    <strong>Preferred contact method</strong>
                    <br>
                    <label for="phone">Phone</label>
                    <input type="radio" id="phone" name="contact_method" value="Phone" required>
                    <label for="email">Email</label>
                    <input type="radio" id="email" name="contact_method" value="Email" required>
                    <br>
                    <label for="message">Message</label>
                    <textarea name="message" id="message" value="" required></textarea>
                    <br>
                    <input type="submit" value="Submit">
                </form>
            </div>
        </section>

    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Centria Edu</p>
        </div>
    </footer>

</body>

</html>
